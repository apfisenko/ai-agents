[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidd"
version = "0.1.0"
description = "Telegram-бот с LLM (MVP)"
readme = "ReadMe.md"
requires-python = "==3.11.*"
dependencies = [
  "aiogram>=3.4,<4",
  "openai>=1.40,<2",
  "python-dotenv>=1.0.0",
  "langchain>=1.2.18,<2",
  "langchain-classic>=1.0,<2",
  "langchain-core>=1.3,<2",
  "langchain-openai>=1.1,<2",
  "langchain-community>=0.4,<1",
  "langchain-huggingface>=1,<2",
  "langchain-text-splitters>=1.0,<2",
  "pypdf>=4.0,<6",
  "langsmith>=0.3,<0.9",
  "datasets>=3.0,<4",
  "ragas>=0.2.0,<0.5",
  "rank-bm25>=0.2.2,<0.3",
  "sentence-transformers>=3.0,<4",
  "httpx>=0.27,<1",
  "langchain-mcp-adapters>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aidd"]
